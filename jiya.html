<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyes only 🌹</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,400&family=Quicksand:wght@500;700&display=swap">
<style>
:root{--bg1:#ff7eb0;--bg2:#d81b72;--bg3:#6e0b3f;--ink:#fff1f6;--soft:#ffc2d9;--card:rgba(22,6,15,.86);--accent:#ff2d7a;--gold:#e8c27a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a0b2b;--bg2:#210713;--bg3:#0d0309}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Quicksand,system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow-x:hidden;overflow-y:auto;display:flex;text-align:center}
.p{position:fixed;bottom:-40px;opacity:.45;color:#ff9ec4;animation:up linear infinite;pointer-events:none;z-index:1}
@keyframes up{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
.card{position:relative;z-index:2;margin:auto;width:min(92vw,400px);background:var(--card);border:1px solid rgba(232,194,122,.45);border-radius:22px;box-shadow:0 0 0 1px rgba(255,45,122,.25),0 24px 70px rgba(255,45,122,.35);overflow:hidden}
.bar{height:3px;background:rgba(255,255,255,.12)}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s}
.pg{padding:20px 22px 26px;animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.tag{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:700;margin-bottom:14px}
figure{margin:0 -22px 18px;height:min(44vh,370px);overflow:hidden;position:relative}
figure img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 14s ease-out both}
figure:after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--card))}
@keyframes kb{from{transform:scale(1.12)}}
h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-style:italic;font-size:29px;line-height:1.15;margin:0 0 12px}
h2 em{color:var(--accent);font-style:normal}
p{color:var(--soft);font-size:16px;line-height:1.55;margin:0 0 22px}
.sig{color:var(--gold);font-family:Fraunces,Georgia,serif;font-style:italic}
button,.sms{font:700 16px Quicksand,system-ui,sans-serif;border:0;border-radius:999px;padding:14px 30px;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#fff;background:linear-gradient(135deg,var(--accent),#ff6fa5);box-shadow:0 8px 24px rgba(255,45,122,.5);text-decoration:none;display:inline-block}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:72px}
#yes{transition:transform .25s}
#no{background:transparent;color:var(--soft);box-shadow:none;border:1px solid rgba(255,255,255,.35)}
#no.run{position:fixed;z-index:9;transition:left .25s,top .25s;background:var(--card)}
.ring{width:130px;height:130px;margin:6px auto 22px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 30px var(--accent),inset 0 0 30px rgba(255,45,122,.5);display:flex;align-items:center;justify-content:center;font-size:54px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
</style></head>

const P=[
{c:1,html:`<div class="tag">PRIVATE · EYES ONLY</div><div class="ring">🌹</div><h2>One invitation.<br>One recipient.</h2><p>Prepared for <b style="color:var(--ink)">${nm}</b>.<br>Clearance level: the only one that matters.</p>`,b:'Open the file'},
{t:'CHAPTER I · THE CONFESSION',i:3,y:22,h:'I’ve messed up. <em>Often.</em>',p:'You’ve read the full file, and it’s not short. I’m sorry, truly. You deserve better than my worst, and you’ll get my best. Here’s the one entry that has never been a mistake: I love you.'},
{t:'CHAPTER II · EXHIBIT A',i:0,h:'Best version of me.',p:'Every file needs evidence. The first piece: I’m at my best standing next to you. Ask anyone. Ask the camera.'},
{t:'CHAPTER III · EXHIBIT B',i:2,h:'The sea <em>lost.</em>',p:'It had one job that evening: be the most beautiful thing in the frame. It never stood a chance.'},
{t:'CHAPTER IV · THE ROOM',i:5,h:'The most dangerous person in the room.',p:'I always locate her first. Old habit. Neon, noise, a crowded room, and still it’s you. It’s always you.'},
{t:'CHAPTER V · THE SAFE HOUSE',i:6,h:'Safe house <em>confirmed.</em>',p:'Security detail: one golden retriever, zero tolerance for strangers. Everything I care about is inside this frame.'},
{t:'CHAPTER VI · THE REQUEST',i:4,h:'Wear the <em>red dress.</em>',p:'You’re the queen of my world. Wear the red dress, and together we’ll rule the room. You bring the crown. I’ll bring the smile of the luckiest man in it.'},
{c:1,o:1,html:`<div class="tag">CHAPTER VII · THE OFFER</div><div class="ring">🥂</div><h2>Tomorrow <em>evening.</em></h2><p>I’ll handle the reservation, the car and the conversation. You handle the entrance.<br><br>I don’t do ultimatums. I do outcomes.</p><div class="row"><button id="yes">Accept 🥂</button><button id="no">Decline</button></div>`},
{t:'MISSION ACCOMPLISHED',i:1,h:'Wise <em>decision.</em>',p:'Tomorrow evening. Dress code: red. Car: already on its way. Take your time getting ready. I’ve waited this long.<br><span class="sig">— Your favourite problem</span>',s:1}
];
